<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ranking row hourglass</title>
</head>
<body>
  <p id="page">page</p>
  <iframe id="grid" title="st_aggrid.agGrid"></iframe>
  <script src="../row_click_hourglass.js"></script>
  <script>
    const frame = document.getElementById("grid");
    frame.addEventListener("load", () => {
      armRankingRowHourglass(document);
      armRankingRowHourglass(frame.contentDocument);
      const before = getComputedStyle(document.getElementById("page")).cursor;
      const cellCursor = getComputedStyle(frame.contentDocument.getElementById("cell")).cursor;
      clearRankingRowHourglassWhenGridsPaint(document);
      const during = getComputedStyle(document.getElementById("page")).cursor;
      setTimeout(() => {
        const stillWaiting = getComputedStyle(document.getElementById("page")).cursor;
        frame.contentDocument.body.innerHTML = "<div class='ag-root'></div>";
        setTimeout(() => {
          window.__hourglass = {
            before,
            cellCursor,
            during,
            stillWaiting,
            after: getComputedStyle(document.getElementById("page")).cursor,
            classAfter: document.documentElement.classList.contains("ranking-row-wait"),
          };
        }, 250);
      }, 80);
    });
    frame.srcdoc = "<!DOCTYPE html><html><body><div id='cell'>row</div></body></html>";
  </script>
</body>
</html>
